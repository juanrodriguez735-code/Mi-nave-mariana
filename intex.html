<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Recolectar Monedas</title>

<style>
    body{
        margin:0;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#222;
        font-family:Arial, sans-serif;
        color:white;
    }

    #contenedor{
        text-align:center;
    }

    canvas{
        background:#8dd35f;
        border:4px solid #000;
    }

    h2{
        margin-bottom:10px;
    }
</style>
</head>
<body>

<div id="contenedor">
    <h2>Puntos: <span id="puntos">0</span></h2>
    <canvas id="juego" width="600" height="400"></canvas>
    <p>Usa las flechas del teclado para moverte.</p>
</div>

<script>
const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");

const jugador = {
    x: 50,
    y: 50,
    tamaño: 30,
    velocidad: 5
};

const moneda = {
    x: 300,
    y: 200,
    radio: 10
};

let puntos = 0;
const teclas = {};

document.addEventListener("keydown", e => teclas[e.key] = true);
document.addEventListener("keyup", e => teclas[e.key] = false);

function moverJugador(){
    if(teclas["ArrowUp"]) jugador.y -= jugador.velocidad;
    if(teclas["ArrowDown"]) jugador.y += jugador.velocidad;
    if(teclas["ArrowLeft"]) jugador.x -= jugador.velocidad;
    if(teclas["ArrowRight"]) jugador.x += jugador.velocidad;

    // Límites
    jugador.x = Math.max(0, Math.min(canvas.width - jugador.tamaño, jugador.x));
    jugador.y = Math.max(0, Math.min(canvas.height - jugador.tamaño, jugador.y));
}

function dibujarJugador(){
    ctx.fillStyle = "blue";
    ctx.fillRect(jugador.x, jugador.y, jugador.tamaño, jugador.tamaño);
}

function dibujarMoneda(){
    ctx.beginPath();
    ctx.arc(moneda.x, moneda.y, moneda.radio, 0, Math.PI*2);
    ctx.fillStyle = "gold";
    ctx.fill();
    ctx.strokeStyle = "orange";
    ctx.stroke();
}

function comprobarColision(){
    let dx = jugador.x + jugador.tamaño/2 - moneda.x;
    let dy = jugador.y + jugador.tamaño/2 - moneda.y;
    let distancia = Math.sqrt(dx*dx + dy*dy);

    if(distancia < jugador.tamaño/2 + moneda.radio){
        puntos++;
        document.getElementById("puntos").textContent = puntos;

        moneda.x = Math.random() * (canvas.width - 40) + 20;
        moneda.y = Math.random() * (canvas.height - 40) + 20;
    }
}

function actualizar(){
    moverJugador();
    comprobarColision();
}

function dibujar(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    dibujarMoneda();
    dibujarJugador();
}

function bucle(){
    actualizar();
    dibujar();
    requestAnimationFrame(bucle);
}

bucle();
</script>

</body>
</html>
